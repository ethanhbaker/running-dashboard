<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Training · Ethan's Training</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    /* ---- training-log-specific styles (scoped to this page) ---- */
    .cal-grid {
      display: grid;
      grid-template-columns: repeat(14, 1fr);
      gap: 4px;
    }
    .cal-cell {
      position: relative;
      aspect-ratio: 1 / 1;
      border-radius: 4px;
      cursor: pointer;
      transition: transform 0.08s ease;
    }
    .cal-cell:hover { transform: scale(1.15); z-index: 2; }
    .cal-cell.cal-race {
      box-shadow: 0 0 0 2px var(--text-primary) inset;
    }
    .cal-cell .cal-star {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 9px;
      line-height: 1;
      color: var(--card);
      pointer-events: none;
    }
    .cal-legend {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      margin-top: 12px;
      font-size: 12px;
      color: var(--text-secondary);
    }
    .cal-legend-item {
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .cal-legend-swatch {
      width: 11px;
      height: 11px;
      border-radius: 3px;
      display: inline-block;
      flex: none;
    }
    .cal-note {
      margin-top: 10px;
      font-size: 12px;
      color: var(--text-muted);
      font-style: italic;
    }
    .load-flag-line {
      margin: 0 0 6px;
      font-size: 13px;
    }
    .load-flag-line:last-child { margin-bottom: 0; }
    .load-flag-dot {
      display: inline-block;
      font-size: 10px;
      margin-right: 4px;
    }
    .rest-streak-note {
      margin-top: 6px;
      font-size: 12px;
      color: var(--text-secondary);
    }

    @media (max-width: 600px) {
      .cal-grid { grid-template-columns: repeat(7, 1fr); gap: 3px; }
    }
    @media (max-width: 400px) {
      .cal-grid { gap: 2px; }
      .cal-cell { border-radius: 3px; }
      .cal-legend { gap: 8px 10px; font-size: 11px; }
    }
  </style>
</head>
<body data-page="training">
  <main class="app-main" id="main"></main>

  <script src="js/layout.js"></script>
  <script src="js/charts.js"></script>
  <script src="js/training.js"></script>
</body>
</html>
